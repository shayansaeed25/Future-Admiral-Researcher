name: Future Admiral Macro Check

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Test every macro source from the GitHub runner
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python macro_check.py
